server:
  port: ${API_PORT:8081}

spring:
  application:
    name: api-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stockdata}
    username: ${POSTGRES_USER:stockuser}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

watchlist:
  symbols: ${WATCHED_SYMBOLS:AAPL,MSFT,GOOGL,TSLA,AMZN}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

kafka:
  topic:
    candles: candles
    alerts: alerts
  group-prefix: api-server-live

logging:
  level:
    com.stockpipeline.api: INFO